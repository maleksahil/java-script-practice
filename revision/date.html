<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new Date</title>
</head>
<body>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .clock{
            width: 100%;
            height: 100vh;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: skyblue;
        }

        .clock input{
            width: 100px;
            height: 50px;
            display: flex;
            padding-left: 10px;
            font-size: 2rem;
        }

        .clock label{
            font-size: 2rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 500;
        }
    </style>
    <div class="clock">
        <label>Year</label>
    <input id="demo"></input>
    <label>month</label>
    <input id="demo1"> </input>
    <label>date</label>
    <input id="demo2"> </input>
    <label>day</label>
    <input id="demo3"></input>
    <label>hours</label>
    <input id="demo4"> </input>
    <label>minutes</label>
    <input id="demo5"> </input>
    <label>seconds</label>
    <input id="demo6"> </input>
</div>
    <script>

        let p = document.getElementById('demo');
        let p1 = document.getElementById('demo1');
        let p2 = document.getElementById('demo2');
        let p3 = document.getElementById('demo3');
        let p4 = document.getElementById('demo4');
        let p5 = document.getElementById('demo5');
        let p6 = document.getElementById('demo6');
        let p7 = document.getElementById('demo7');

        console.log(new Date()) //current date

function display(){

        console.log(new Date().getFullYear()) // Current year
        p.value = (new Date().getFullYear())


        console.log(new Date().getMonth()) //current month 0 to 11
        p1.value = (new Date().getMonth())
       
        console.log(new Date().getDate()) //current date
        p2.value = (new Date().getDate())
    
        console.log(new Date().getDay()) //get day 0 = sunday
        p3.value = (new Date().getDay())
    
        console.log(new Date().getHours()) // 0 to 23
        p4.value = (new Date().getHours())
    
        console.log(new Date().getMinutes()) //get miniutes
        p5.value = (new Date().getMinutes())
    
        console.log(new Date().getSeconds()) //get seconds
        p6.value = (new Date().getSeconds())
        p6.value = new Date().getSeconds()

}

setInterval(() => {
    display()
}, 1000);
    </script>
</body>
</html>
