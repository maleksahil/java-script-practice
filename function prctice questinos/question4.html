<script>
    // Write a JavaScript function that returns a string with letters in alphabetical order.
    // Example string : 'webmaster'
    // Expected Output : 'abeemrstw'
  
    function order(str) {
      return str.split("").sort().join("");
    }
  

    let str = "raziya";
  

    let result = order(str); 
  

    console.log(result); 
  </script>
