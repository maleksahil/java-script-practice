<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
</head>
<body>
    
    <div class="card">
        <p>Name : Prashant</p>
        <p>Class : 9</p>

        <button onclick="addtocart('prashant',9)">add to cart</button>
    </div>

    <script>
        let cart = [];

        function addtocart(name,std){
             console.log(name,std)

             cart.push({name,std});

             console.log(cart)

             let mycart = JSON.stringify(cart);

             console.log(mycart)

             localStorage.setItem('cart',mycart)
             
        }

    </script>
</body>
</html>
