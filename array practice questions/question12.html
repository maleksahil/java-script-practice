<script>
    // Write a JavaScript program to compute the sum and product of an array of integers.

    let arr = [1,2,3,4,5];

    let s = 0;
    let p = 1;

    for (let x =0; x<arr.length; x++){
        // console.log(arr[x])

        s+= arr[x];

        p *= arr[x];
    }

    console.log(`sum id ${s} for ${p} items`)
    // console.log(s)
    // console.log(p)
</script>
