    let count = 0;

        // console.log(arr1[x])
        for(let z = x; z<arr1.length; z++){
            
            if(arr1[x] == arr1[z]){
                count++
            }

            if(savecount < count){
                savecount = count;
                item = arr1[x];
            }
        }

        count = 0;
    }

    console.log(item , savecount)
</script>
